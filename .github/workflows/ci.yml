name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Qualidade, cobertura e builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verificar código
        run: |
          npm run architecture
          npm run typecheck
          npm run lint
          npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build:storybook
      - name: Guardar Storybook
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: storybook-static/
          retention-days: 7
      - name: Guardar cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Builds e integração Docker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TMDB_READ_ACCESS_TOKEN: docker-ci-placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verificar URLs em runtime sem recompilar
        env:
          NEXO_CATALOG_REMOTE_URL: http://127.0.0.1:4101/remoteEntry.js?docker-runtime=1
        run: |
          docker compose up --no-deps --force-recreate --wait --wait-timeout 60 shell
          node --input-type=module -e "import assert from 'node:assert/strict'; const response = await fetch('http://127.0.0.1:4100/runtime-config.json'); assert.equal(response.status, 200); const config = await response.json(); assert.equal(config.remotes.catalog, process.env.NEXO_CATALOG_REMOTE_URL);"
      - run: npm run test:docker
      - name: Logs dos containers
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=100
      - name: Encerrar containers
        if: ${{ always() }}
        run: docker compose down
      - name: Guardar relatório Docker
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-playwright-report
          path: |
            playwright-report-docker/
            test-results-docker/
          retention-days: 7
  e2e:
    name: Componentes e E2E desktop e mobile
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storybook
      - run: npm run test:e2e
      - name: Guardar relatório E2E
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
